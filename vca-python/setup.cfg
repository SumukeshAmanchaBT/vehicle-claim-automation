[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    migrations,
    *.egg-info

# Ignore rules that conflict with Black formatter
ignore =
    E203,
    E501,
    W503,
    W504,
    # Allow bare except in API views
    E722

per-file-ignores =
    # Allow star imports in Django settings
    */settings.py:F401,F403,F405
    # Allow unused imports in __init__.py
    */__init__.py:F401
